<title>NCKU Baseball｜JSON 比賽解碼工具</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#efefef;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif}
.bar{
  position:sticky;top:0;z-index:20;background:rgba(250,250,250,.97);backdrop-filter:blur(8px);

.pick input{display:none}
button.active{background:#222;color:#fff;border-color:#222}

.viewer{max-width:100%;margin:0 auto;padding:0 10px 16px}
iframe{width:100%;height:1250px;border:0;background:#fff;display:none}
iframe.active{display:block}
@media(max-width:700px){
  .status{width:100%;margin-left:0}
  iframe{height:1100px}
}
</style>

  <label class="pick">載入 JSON<input id="jsonFile" type="file" accept=".json,application/json"></label>

  <button id="heatBtn" type="button">投打 25 宮格</button>

  25 宮格固定標示為<strong>捕手視角</strong>，左側為三壘側、右側為一壘側。
  PDF 按鈕會列印目前正在看的頁面。載入 JSON 時會自動依序嘗試 UTF-8、UTF-8 fallback、Big5/CP950，並保守修復常見 UTF-8→Latin-1 亂碼；若是 9/19 那種「白隊打序只輸入兩人」造成的姓名錯置，則由比賽修復規則處理，兩者不混為一談。
</div>

&lt;html lang=&quot;zh-Hant&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1,viewport-fit=cover&quot;&gt;
&lt;title&gt;棒球正式記錄表解碼器｜早稻田式 / 台灣常見版&lt;/title&gt;
&lt;style&gt;
:root{
  --ink:#111;
  --grid:#303030;
  --thin:#8c8c8c;
  --paper:#fff;
  --red:#d92626;
  --blue:#24579c;
  --bg:#e9e9e9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:&quot;Microsoft JhengHei&quot;,&quot;Noto Sans TC&quot;,Arial,sans-serif;color:var(--ink)}
.toolbar{
  position:sticky;top:0;z-index:9999;background:#f6f6f6;border-bottom:1px solid #aaa;padding:8px 10px;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap
}
.toolbar button,.filepick{
  background:white;border:1px solid #999;border-radius:6px;padding:8px 12px;font-weight:800;cursor:pointer
}
.filepick input{display:none}
.toolbar .hint{font-size:11px;color:#666}
#root{padding:10px;overflow:auto}
.page{
  width:1640px;height:1110px;margin:0 auto 16px;background:var(--paper);padding:7px;
  box-shadow:0 3px 16px rgba(0,0,0,.14);position:relative;overflow:hidden
}

/* ---------- 上方比賽資料 ---------- */
.game-head{
  height:76px;border:2px solid var(--grid);display:grid;
  grid-template-columns:310px 500px 300px 1fr;font-size:10px
}
.game-head&gt;div{border-right:1px solid var(--grid);padding:4px 7px}
.game-head&gt;div:last-child{border-right:0}
.date{font-size:17px;font-weight:900;letter-spacing:1px}
.match{font-size:18px;font-weight:900;margin-top:6px}
.form-grid{height:100%;display:grid;grid-template-columns:58px 1fr 55px 1fr}
.form-grid span{border-bottom:1px solid #888;padding:2px 3px;display:flex;align-items:center}
.form-grid span:nth-last-child(-n+4){border-bottom:0}
.lab{color:#555}

/* ---------- 主表 ---------- */
.main{
  height:724px;border-left:2px solid var(--grid);border-right:2px solid var(--grid);
  display:grid;grid-template-columns:252px 1fr 358px
}
.left{border-right:2px solid var(--grid)}
.center{overflow:hidden}
.right{border-left:2px solid var(--grid)}

.left-head{
  height:38px;border-bottom:1px solid var(--grid);display:grid;
  grid-template-columns:24px 24px 24px 24px 24px 24px 1fr 30px;
}
.left-head div{
  border-right:1px solid var(--grid);font-size:8px;display:flex;justify-content:center;align-items:center;
  writing-mode:vertical-rl
}
.left-head div:nth-child(7){writing-mode:horizontal-tb;font-size:12px;font-weight:900}
.left-head div:last-child{border-right:0}
.lineup-row{
  height:72px;border-bottom:1px solid var(--grid);display:grid;
  grid-template-columns:24px 24px 24px 24px 24px 24px 1fr 30px
}
.lineup-row&gt;div{border-right:1px solid var(--thin);font-size:9px;display:flex;justify-content:center;align-items:center}
.lineup-row&gt;div:nth-child(7){border-right:1px solid var(--grid);justify-content:flex-start;padding:2px 5px}
.lineup-row&gt;div:last-child{border-right:0}
.names{display:flex!important;flex-direction:column;align-items:flex-start!important;justify-content:center!important;line-height:1.15}
.names .starter{font-size:13px;font-weight:900}
.names .sub{font-size:10px;width:100%;border-top:1px dotted #999;margin-top:2px;padding-top:2px}
.pos{display:flex!important;flex-direction:column;font-weight:800;line-height:1.1}
.slot{font-size:14px!important;font-weight:900}
.left-foot{height:38px;border-bottom:1px solid var(--grid)}

/* ---------- 中央 9 局格 ---------- */
.inning-head{
  height:38px;border-bottom:1px solid var(--grid);display:grid;grid-template-columns:repeat(9,1fr)
}
.inning-head div{border-right:1px solid var(--grid);font-size:19px;font-weight:900;padding:2px 6px}
.inning-head div:last-child{border-right:0}
.score-grid{height:648px;display:grid;grid-template-rows:repeat(9,72px)}
.score-row{display:grid;grid-template-columns:repeat(9,1fr);border-bottom:1px solid var(--grid)}
.score-row:last-child{border-bottom:0}
.cell{position:relative;border-right:1px solid var(--grid);overflow:hidden;background:#fff}
.cell:last-child{border-right:0}
.cell svg{position:absolute;inset:0;width:100%;height:100%}
.cell.missing{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#f1f1f1 6px,#f1f1f1 12px)}
.cell.missing:after{content:&quot;缺&quot;;position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:17px;font-weight:900}

.pitchcol{
  position:absolute;left:1px;top:1px;width:17px;height:70px;border-right:1px solid #aaa;
  font-size:9px;line-height:9px;text-align:center;padding-top:1px
}
.pitchmark{height:10px}
.play{
  position:absolute;left:24px;bottom:3px;font-size:11px;font-weight:900;white-space:nowrap;
  z-index:8;background:rgba(255,255,255,.94);padding:0 2px;border-radius:2px
}
.quality{
  position:absolute;left:21px;top:2px;font-size:9px;color:#444;white-space:nowrap
}
.out-no{
  position:absolute;right:4px;bottom:4px;width:19px;height:19px;border:2px solid var(--red);
  color:var(--red);border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900
}
.final-center{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  font-size:17px;font-weight:900;color:var(--red);z-index:5
}
.final-center.score{font-size:17px}
.final-center.lob{color:#333;font-size:16px;font-style:italic}
.runner-out{position:absolute;color:var(--red);font-size:10px;font-weight:900}

.advance-label{
  position:absolute;color:#b32222;font-size:7px;font-weight:900;background:rgba(255,255,255,.94);
  padding:0 1px;z-index:6;line-height:9px;border-radius:2px
}
.rbi{position:absolute;right:2px;top:2px;color:var(--red);font-size:9px;font-weight:900}
.hit-circle{
  display:inline-grid;place-items:center;width:18px;height:18px;border:1.7px solid #111;border-radius:50%;
  font-size:10px;line-height:1;margin-right:2px;vertical-align:-4px;background:#fff
}
.manual{outline:2px dotted #888;outline-offset:-3px}

.inning-foot{
  height:38px;border-top:1px solid var(--grid);display:grid;grid-template-columns:repeat(9,1fr)
}
.inning-foot&gt;div{border-right:1px solid var(--grid);display:grid;grid-template-columns:repeat(3,1fr);font-size:8px;text-align:center}
.inning-foot&gt;div:last-child{border-right:0}
.inning-foot span{border-right:1px solid #aaa;display:flex;align-items:center;justify-content:center}
.inning-foot span:last-child{border-right:0}

/* ---------- 右側統計 ---------- */
.right-head{height:38px;border-bottom:1px solid var(--grid);display:grid;grid-template-columns:repeat(15,1fr)}
.right-head div{
  border-right:1px solid var(--grid);font-size:8px;font-weight:800;display:flex;justify-content:center;align-items:center;
  writing-mode:vertical-rl
}
.right-head div:last-child{border-right:0}
.stat-row{height:72px;border-bottom:1px solid var(--grid);display:grid;grid-template-columns:repeat(15,1fr)}
.stat-row div{border-right:1px solid var(--thin);font-size:10px;display:flex;justify-content:center;align-items:center}
.stat-row div:last-child{border-right:0}
.right-foot{height:38px;border-top:1px solid var(--grid)}

/* ---------- 中段比分 ---------- */
.summary{
  height:76px;border:2px solid var(--grid);border-top:0;display:grid;grid-template-columns:252px 1fr 358px
}
.summary-left{border-right:2px solid var(--grid);display:grid;grid-template-columns:42px 1fr;font-size:10px}
.summary-left div{display:flex;justify-content:center;align-items:center;border-right:1px solid var(--grid)}
.summary-left div:last-child{border-right:0;justify-content:flex-start;padding-left:8px;font-size:13px;font-weight:900}
.summary-mid{display:grid;grid-template-rows:38px 38px}
.sum-row{display:grid;grid-template-columns:repeat(9,1fr)}
.sum-row div{border-right:1px solid var(--grid);display:flex;justify-content:center;align-items:center;font-size:10px}
.sum-row:first-child{border-bottom:1px solid var(--grid)}
.sum-row div:last-child{border-right:0}
.summary-right{border-left:2px solid var(--grid)}

/* ---------- 底部投捕 / 驗算 ---------- */
.bottom{
  height:235px;border:2px solid var(--grid);border-top:0;display:grid;grid-template-columns:925px 330px 1fr
}
.pitchers{border-right:2px solid var(--grid)}
.catchers{border-right:2px solid var(--grid)}
.bt{height:28px;border-bottom:1px solid var(--grid);font-size:14px;font-weight:900;padding:4px 0 0 75px}
.tbl{border-collapse:collapse;width:100%;table-layout:fixed;font-size:8px}
.tbl th,.tbl td{height:29px;border-right:1px solid var(--thin);border-bottom:1px solid var(--thin);text-align:center;padding:1px}
.tbl th{height:25px;background:#fafafa}
.tbl th:first-child,.tbl td:first-child{width:155px;text-align:left;padding-left:5px;font-size:10px}
.verify{padding:5px 8px}
.verify-title{text-align:center;font-weight:900;border-bottom:1px solid #999;padding-bottom:4px}
.eq{font-size:11px;font-weight:800;margin:10px 0;white-space:nowrap}
.sq{display:inline-block;width:22px;height:22px;border:1.5px solid #777;vertical-align:middle;margin:0 1px;line-height:19px;text-align:center}
.legend{font-size:8px;color:#444;line-height:1.45;margin-top:10px}
.page-tag{position:absolute;right:9px;top:82px;writing-mode:vertical-rl;font-size:9px;color:#777}

@media(max-width:900px){
  #root{padding:5px}.page{margin:0 0 10px}
}
@media print{
  @page{size:A3 landscape;margin:4mm}
  body{background:#fff}.toolbar{display:none}#root{padding:0}.page{box-shadow:none;margin:0;width:100%;page-break-after:always}
}

/* ---------- 打球方向：優先採 notation / chain；安打則以落點導出 7/8/9 ---------- */
function landingFielder(e){

    return x?.positionNo||x?.posNo||x?.position||x?.pos||x?.fielder||&quot;&quot;;
  }).filter(Boolean);
  if(chain.length) return chain.join(&quot;-&quot;);
  if(e?.trigger){
    const t=e.trigger.positionNo||e.trigger.posNo||e.trigger.position||e.trigger.pos||e.trigger.fielder;
    if(t) return String(t);
  }
  return &quot;&quot;;
}

  if(o===&quot;SH&quot;) return (fieldingSequence(e)||&quot;&quot;)+&quot;SH&quot;;

/* ---------- 跑壘 state machine ---------- */
function segments(from,to){
  const order=[&quot;H&quot;,&quot;1&quot;,&quot;2&quot;,&quot;3&quot;,&quot;H&quot;];
  if(from===&quot;H&quot;&amp;&amp;to===&quot;H&quot;) return [[&quot;H&quot;,&quot;1&quot;],[&quot;1&quot;,&quot;2&quot;],[&quot;2&quot;,&quot;3&quot;],[&quot;3&quot;,&quot;H&quot;]];
  let a=order.indexOf(from), b=to===&quot;H&quot;?4:order.indexOf(to);
  if(a&lt;0||b&lt;0||b&lt;=a)return[];
  const s=[];for(let i=a;i&lt;b;i++)s.push([order[i],order[i+1]]);return s;
}

function addSegment(model,a,b,label){
  model.segments.push([a,b]);

}

function buildModels(g,pas,side,roster){
  const team=pas.filter(p=&gt;p.side===side).sort((a,b)=&gt;(a.inning-b.inning)||((a.events[0]?.ts||0)-(b.events[0]?.ts||0)));
  const models=new Map(team.map(pa=&gt;[pa,makeModel(pa)]));

  // 終結事件 id -&gt; plate appearance
  const paByFinalId=new Map();
  for(const pa of team){
    const id=pa.final?.id;
    if(id) paByFinalId.set(id,pa);
  }

  const origin=new Map();   // runner id -&gt; origin cell
  const baseOf=new Map();   // runner id -&gt; current base
  const outCount={};
  let currentInning=null;

  function closeInning(){
    for(const [rid,base] of [...baseOf.entries()]){
      if(base!==&quot;OUT&quot;&amp;&amp;base!==&quot;SCORED&quot;){
        const m=origin.get(rid);
        if(m &amp;&amp; !m.final) m.final=&quot;LOB&quot;;
      }
    }
    baseOf.clear();
    origin.clear();
  }

  function ensureInning(inn){
    if(currentInning!==null &amp;&amp; inn!==currentInning) closeInning();

    if(!(inn in outCount)) outCount[inn]=0;

    if(!rid) return;
    const m=origin.get(rid);
    if(!m) return;

    if(to===&quot;out&quot;){
      outCount[currentInning]++;
      m.runnerOuts.push({base:from,no:outCount[currentInning],text:reason});
      m.final=ROMAN[outCount[currentInning]]||String(outCount[currentInning]);

      baseOf.delete(rid); origin.delete(rid);

  // steal / wp / 捕逸 / 趁傳等非打席終結事件也會更新原始跑者格。
  for(const e of g.events||[]){

      const pa=paByFinalId.get(e.id);
      if(!pa) continue;
      const m=models.get(pa), o=outcome(e);
      const batterId=pa.id || e.batterId || (&quot;anon-&quot;+e.id);

      // 先處理原有跑者
      const bb=e.basesBefore||{};
      for(const base of [&quot;1&quot;,&quot;2&quot;,&quot;3&quot;]){
        const rid=bb[base];
        if(!rid) continue;
        const to=e.runnerPlan?.[base]?.to;
        if(!to || to===base) continue;
        moveRunner(rid,base,to,&quot;&quot;);
      }

      // 再處理打者
      let bt=e.runnerPlan?.batter?.to;
      if(!bt){
        if([&quot;1B&quot;,&quot;BB&quot;,&quot;HBP&quot;,&quot;失誤上壘&quot;,&quot;野手選擇&quot;].includes(o)) bt=&quot;1&quot;;
        else if(o===&quot;2B&quot;) bt=&quot;2&quot;;
        else if(o===&quot;3B&quot;) bt=&quot;3&quot;;
        else if(o===&quot;HR&quot;) bt=&quot;score&quot;;
        else if(isOut(o)) bt=&quot;out&quot;;
      }

      if(bt===&quot;out&quot; || isOut(o)){
        outCount[inn]++;

        m.final=ROMAN[outCount[inn]]||String(outCount[inn]);

          origin.set(batterId,m);

        }

      const from=String(e.from||&quot;&quot;);
      const rid=e.basesBefore?.[from];
      const to=e.result===&quot;成功&quot; ? String(e.to||&quot;&quot;) : &quot;out&quot;;
      moveRunner(rid,from,to,e.result===&quot;成功&quot;?&quot;SB&quot;:&quot;CS&quot;);

    }else if(e.type===&quot;wp&quot;){
      const bb=e.basesBefore||{};
      const reason=e.kind===&quot;捕逸&quot; ? &quot;PB&quot; : &quot;WP&quot;;
      for(const base of [&quot;3&quot;,&quot;2&quot;,&quot;1&quot;]){
        const rid=bb[base];
        const act=e.adv?.[base];
        if(!rid||!act) continue;
        let to;
        if(act===&quot;score&quot;) to=&quot;score&quot;;
        else to=base===&quot;1&quot;?&quot;2&quot;:base===&quot;2&quot;?&quot;3&quot;:&quot;score&quot;;
        moveRunner(rid,base,to,reason);
      }

    }else if(e.type===&quot;advance&quot;){
      const from=String(e.from||&quot;&quot;);
      const rid=e.basesBefore?.[from];
      const to=String(e.to||&quot;&quot;);
      moveRunner(rid,from,to,e.advanceReason||e.kind||&quot;ADV&quot;);

    }else if(e.type===&quot;pickoff&quot; &amp;&amp; e.result &amp;&amp; e.result!==&quot;安全&quot;){
      const base=String(e.base||&quot;&quot;);
      const rid=e.basesBefore?.[base];
      moveRunner(rid,base,&quot;out&quot;,&quot;PO&quot;);
    }

    if(outCount[inn]&gt;=3){
      for(const [rid,base] of [...baseOf.entries()]){
        const om=origin.get(rid);
        if(om &amp;&amp; !om.final) om.final=&quot;LOB&quot;;
      }
      baseOf.clear(); origin.clear();
    }
  }

  if(currentInning!==null) closeInning();

  // 人工補登而沒有原始 event id 的打席，保留基本終局符號
  for(const pa of team){
    if(pa.final?.id) continue;
    const m=models.get(pa), o=outcome(pa.final||{});
    if(isOut(o) &amp;&amp; !m.final){
      const inn=pa.inning;
      if(!(inn in outCount)) outCount[inn]=0;
      outCount[inn]++;
      m.outNo=outCount[inn];
      m.final=ROMAN[outCount[inn]]||String(outCount[inn]);
    }
  }

  return models;
}

/* ---------- 菱形 ---------- */
function diamondSVG(m){
  if(!m)return&quot;&quot;;
  const P={H:[58,63],&quot;1&quot;:[80,39],&quot;2&quot;:[58,15],&quot;3&quot;:[36,39]};
  const seen=new Set();
  let lines=&quot;&quot;;
  for(const [a,b] of m.segments){
    const k=a+&quot;-&quot;+b;if(seen.has(k))continue;seen.add(k);
    lines+=`&lt;line x1=&quot;${P[a][0]}&quot; y1=&quot;${P[a][1]}&quot; x2=&quot;${P[b][0]}&quot; y2=&quot;${P[b][1]}&quot; stroke=&quot;#d92626&quot; stroke-width=&quot;3.1&quot; stroke-linecap=&quot;round&quot;/&gt;`;
  }
  return `&lt;svg viewBox=&quot;0 0 100 72&quot; preserveAspectRatio=&quot;none&quot;&gt;
    &lt;polygon points=&quot;58,15 80,39 58,63 36,39&quot; fill=&quot;none&quot; stroke=&quot;#777&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;2.5 2&quot;/&gt;
    ${lines}
  &lt;/svg&gt;`;
}
function labelPos(a,b){
  const map={
    // H→1：放在右下斜邊中段，不佔用左下角打擊記號區
    &quot;H1&quot;:&quot;right:4px;bottom:25px&quot;,
    // 1→2：右上斜邊
    &quot;12&quot;:&quot;right:7px;top:14px&quot;,
    // 2→3：左上斜邊
    &quot;23&quot;:&quot;left:23px;top:14px&quot;,
    // 3→H：左下斜邊，但往上移，避開左下角 play notation
    &quot;3H&quot;:&quot;left:22px;bottom:27px&quot;
  };
  return map[a+b]||&quot;&quot;;
}
function runnerOutPos(base){
  return base===&quot;1&quot;?&quot;right:16px;top:35px&quot;:base===&quot;2&quot;?&quot;left:48px;top:8px&quot;:&quot;left:22px;top:35px&quot;;
}

function cellHTML(model,missing=false){
  if(missing)return `&lt;div class=&quot;cell missing&quot;&gt;&lt;/div&gt;`;
  if(!model)return `&lt;div class=&quot;cell&quot;&gt;&lt;/div&gt;`;
  const pa=model.pa,e=pa.final||{}, p=playNotation(e);
  const marks=(pa.events||[]).map(pitchMark).filter(Boolean).slice(0,7);
  let play=&quot;&quot;;
  if(typeof p===&quot;object&quot;&amp;&amp;p.hit){
    play=`&lt;span class=&quot;hit-circle&quot;&gt;${esc(p.fielder)}&lt;/span&gt;${esc(p.suffix)}`;
  }else play=esc(p);

  const labels=(model.labels||[])
    .filter(x=&gt;[&quot;SB&quot;,&quot;CS&quot;,&quot;WP&quot;,&quot;PB&quot;,&quot;PO&quot;,&quot;ADV&quot;,&quot;趁傳&quot;].includes(x.text))
    .map(x=&gt;`&lt;div class=&quot;advance-label&quot; style=&quot;${labelPos(x.a,x.b)}&quot;&gt;${esc(x.text)}&lt;/div&gt;`).join(&quot;&quot;);
  const ro=(model.runnerOuts||[]).map(x=&gt;`&lt;div class=&quot;runner-out&quot; style=&quot;${runnerOutPos(x.base)}&quot;&gt;×${x.no}${x.text?` ${esc(x.text)}`:&quot;&quot;}&lt;/div&gt;`).join(&quot;&quot;);

  let center=&quot;&quot;;
  if(model.final===&quot;SCORE&quot;) center=`&lt;div class=&quot;final-center score&quot;&gt;●&lt;/div&gt;`;
  else if(model.final===&quot;LOB&quot;) center=`&lt;div class=&quot;final-center lob&quot; title=&quot;殘壘 Left on Base&quot;&gt;ℓ&lt;/div&gt;`;
  else if(model.final) center=`&lt;div class=&quot;final-center&quot;&gt;${esc(model.final)}&lt;/div&gt;`;

  return `&lt;div class=&quot;cell${pa.manual?&quot; manual&quot;:&quot;&quot;}&quot;&gt;
    ${diamondSVG(model)}
    &lt;div class=&quot;pitchcol&quot;&gt;${marks.map(x=&gt;`&lt;div class=&quot;pitchmark&quot;&gt;${x}&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;
    &lt;div class=&quot;quality&quot;&gt;${esc(trajectoryText(e))}&lt;/div&gt;
    &lt;div class=&quot;play&quot;&gt;${play}&lt;/div&gt;
    ${(e.rbi||0)?`&lt;div class=&quot;rbi&quot;&gt;${e.rbi}打點&lt;/div&gt;`:&quot;&quot;}
    ${model.outNo?`&lt;div class=&quot;out-no&quot;&gt;${model.outNo}&lt;/div&gt;`:&quot;&quot;}
    ${center}${labels}${ro}
  &lt;/div&gt;`;
}

/* ---------- 統計 ---------- */
function summarize(ppas){
  let PA=0,AB=0,R=0,H=0,H1=0,H2=0,H3=0,HR=0,RBI=0,K=0,BB=0,HBP=0,SH=0,SF=0,SB=0;
  for(const pa of ppas){
    const e=pa.final||{},o=outcome(e);PA++;
    if(!NO_AB.has(o))AB++;
    if(HIT.has(o)){H++;if(o===&quot;1B&quot;)H1++;if(o===&quot;2B&quot;)H2++;if(o===&quot;3B&quot;)H3++;if(o===&quot;HR&quot;)HR++}
    RBI+=e.rbi||0;
    if([&quot;三振揮&quot;,&quot;三振看&quot;].includes(o))K++;
    if(o===&quot;BB&quot;)BB++;if(o===&quot;HBP&quot;)HBP++;if(o===&quot;SH&quot;)SH++;if([&quot;SF&quot;,&quot;犧牲飛球&quot;].includes(o))SF++;
  }
  return [PA,AB,R,H,H1,H2,H3,HR,RBI,K,BB,HBP,SH,SF,SB];
}

function renderPage(g,side,pas){
  const roster=slots(g,side);
  const mid=centerPanel(g,pas,side,roster);
  return `&lt;section class=&quot;page&quot;&gt;

    &lt;div class=&quot;main&quot;&gt;

      &lt;div class=&quot;right&quot;&gt;${rightPanel(mid.stats)}&lt;/div&gt;

}
function render(raw){
  if(!raw||!Object.keys(raw).length){
    $(&quot;#root&quot;).innerHTML=`&lt;section class=&quot;page&quot; style=&quot;height:300px;display:grid;place-items:center;font-size:20px;font-weight:900&quot;&gt;請載入 JSON&lt;/section&gt;`;
    return;
  }
  const g=patchKnownGame(raw), pas=buildPAs(g);
  $(&quot;#root&quot;).innerHTML=renderPage(g,&quot;away&quot;,pas)+renderPage(g,&quot;home&quot;,pas);
}
$(&quot;#file&quot;).addEventListener(&quot;change&quot;,async e=&gt;{

function patchKnownGame(raw){
  const g=structuredClone(raw);
  if(g.date!==&quot;2026-09-19&quot;) return g;
  const order=[&quot;王學睿&quot;,&quot;葉詠翔&quot;,&quot;吳尚霖&quot;,&quot;林建曄&quot;,&quot;謝竺庭&quot;,&quot;張晉緁&quot;,&quot;張永宸&quot;,&quot;王祥予&quot;,&quot;趙昱齊&quot;];
  const starts={1:0,2:3,4:1,5:1,6:8,7:2};
  const idx={};
  for(const e of g.events||[]){
    if(e.battingTeam!==&quot;away&quot;||e.halfBefore!==&quot;top&quot;||![&quot;pitch&quot;,&quot;battedball&quot;].includes(e.type)) continue;
    const inn=+e.inningBefore;if(!(inn in starts))continue;
    if(!(inn in idx))idx[inn]=starts[inn];
    const slot=idx[inn];
    e.batterName=(slot===0&amp;&amp;inn&gt;=4)?&quot;張淳嘉&quot;:order[slot];
    if(terminal(e))idx[inn]=(slot+1)%9;
  }
  return g;
}

function buildRows(g){
  const pNow={home:&quot;顏辰峻&quot;,away:&quot;王昱峻&quot;};
  const rows=[];
  for(const e of g.events||[]){
    if(e.type===&quot;sub&quot;&amp;&amp;e.kind===&quot;投手更換&quot;){
      const fs=e.halfBefore===&quot;top&quot;?&quot;home&quot;:&quot;away&quot;;
      pNow[fs]=e.inPlayerName;continue;
    }
    if(![&quot;pitch&quot;,&quot;battedball&quot;].includes(e.type))continue;
    const fs=(e.fieldingTeam===&quot;home&quot;||e.fieldingTeam===&quot;away&quot;)?e.fieldingTeam:(e.halfBefore===&quot;top&quot;?&quot;home&quot;:&quot;away&quot;);
    rows.push({
      pitcher:pNow[fs]||&quot;未知投手&quot;,
      batter:e.batterName||&quot;未知打者&quot;,
      inning:e.inningBefore,half:e.halfBefore,
      pitchType:e.pitchType||null,zone:e.zone,
      result:e.pitchResult||null,eventType:e.type
    });
  }
  return rows;
}

    const pct=denomCounts&amp;&amp;denomCounts[z]&gt;0?Math.round(v/denomCounts[z]*100):null;
    return `&lt;div class=&quot;z ${sz?&quot;strike-zone&quot;:&quot;&quot;}&quot; style=&quot;background:rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})&quot;&gt;
      &lt;span class=&quot;id&quot;&gt;${z}&lt;/span&gt;&lt;b&gt;${v}&lt;/b&gt;${pct!==null?`&lt;span class=&quot;pct&quot;&gt;${pct}%&lt;/span&gt;`:&quot;&quot;}
    &lt;/div&gt;`;
  }).join(&quot;&quot;);
  return `&lt;div class=&quot;card&quot;&gt;
    &lt;h3&gt;${esc(title)}&lt;/h3&gt;&lt;div class=&quot;sub&quot;&gt;${esc(subtitle)}&lt;/div&gt;
    &lt;div class=&quot;axis-top&quot;&gt;高&lt;/div&gt;
    &lt;div class=&quot;grid-wrap&quot;&gt;

    &lt;/div&gt;
    &lt;div class=&quot;axis-bottom&quot;&gt;低&lt;/div&gt;
  &lt;/div&gt;`;
}
function matrixTable(all,whiff,br=null,brw=null){
  let rows=&quot;&quot;;
  for(let z=0;z&lt;25;z++){
    const rr=Math.floor(z/5)+1,cc=z%5+1;
    rows+=`&lt;tr&gt;&lt;td&gt;${z}&lt;/td&gt;&lt;td&gt;${rr}&lt;/td&gt;&lt;td&gt;${cc}&lt;/td&gt;&lt;td&gt;${all[z]}&lt;/td&gt;&lt;td&gt;${whiff[z]}&lt;/td&gt;`+
      (br?`&lt;td&gt;${br[z]}&lt;/td&gt;&lt;td&gt;${brw[z]}&lt;/td&gt;`:&quot;&quot;)+`&lt;/tr&gt;`;
  }
  return `&lt;div class=&quot;table-scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Zone&lt;/th&gt;&lt;th&gt;列&lt;/th&gt;&lt;th&gt;欄&lt;/th&gt;&lt;th&gt;全部&lt;/th&gt;&lt;th&gt;揮空&lt;/th&gt;`+
    (br?`&lt;th&gt;變化球&lt;/th&gt;&lt;th&gt;變化球揮空&lt;/th&gt;`:&quot;&quot;)+`&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;
}
function detailTable(rows){
  const r=rows.filter(validZone).map((x,i)=&gt;`&lt;tr&gt;&lt;td&gt;${i+1}&lt;/td&gt;&lt;td&gt;${x.inning}${halfZh(x.half)}&lt;/td&gt;&lt;td&gt;${esc(x.pitcher)}&lt;/td&gt;&lt;td&gt;${esc(x.batter)}&lt;/td&gt;&lt;td&gt;${esc(x.pitchType||&quot;未知&quot;)}&lt;/td&gt;&lt;td&gt;${x.zone}&lt;/td&gt;&lt;td&gt;${Math.floor(x.zone/5)+1}-${x.zone%5+1}&lt;/td&gt;&lt;td&gt;${esc(x.result||&quot;擊球入場&quot;)}&lt;/td&gt;&lt;/tr&gt;`).join(&quot;&quot;);
  return `&lt;div class=&quot;table-scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;局次&lt;/th&gt;&lt;th&gt;投手&lt;/th&gt;&lt;th&gt;打者&lt;/th&gt;&lt;th&gt;球種&lt;/th&gt;&lt;th&gt;Zone&lt;/th&gt;&lt;th&gt;列-欄&lt;/th&gt;&lt;th&gt;結果&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${r}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;
}

function pitcherSection(name,rows){
  const x=rows.filter(r=&gt;r.pitcher===name),known=x.filter(validZone);
  const all=counts(known),wh=counts(known,r=&gt;r.result===&quot;strike_swing&quot;);
  const br=counts(known,r=&gt;isBreaking(r.pitchType));
  const brw=counts(known,r=&gt;isBreaking(r.pitchType)&amp;&amp;r.result===&quot;strike_swing&quot;);
  return `&lt;section class=&quot;person&quot;&gt;
    &lt;h2&gt;${esc(name)}｜投手&lt;/h2&gt;
    &lt;div class=&quot;meta&quot;&gt;已記錄 ${x.length} 球；有落點 ${known.length} 球；缺落點 ${x.length-known.length} 球；揮空 ${total(wh)}；變化球 ${total(br)}；變化球揮空 ${total(brw)}&lt;/div&gt;

}
function batterSection(name,rows){

  &lt;/section&gt;`;
}

function refreshSelectors(rows){
  const list=mode===&quot;pitcher&quot;?uniqueInOrder(rows.map(r=&gt;r.pitcher)):uniqueInOrder(rows.map(r=&gt;r.batter));
  const sel=$(&quot;#personSelect&quot;);const old=sel.value;sel.innerHTML=list.map(n=&gt;`&lt;option value=&quot;${esc(n)}&quot;&gt;${esc(n)}&lt;/option&gt;`).join(&quot;&quot;);
  if(list.includes(old))sel.value=old;
}
function render(){
  if(!GAME){$(&quot;#content&quot;).innerHTML=`&lt;div class=&quot;empty&quot;&gt;請載入 JSON&lt;/div&gt;`;return}
  const rows=buildRows(GAME);
  refreshSelectors(rows);
  const names=mode===&quot;pitcher&quot;?uniqueInOrder(rows.map(r=&gt;r.pitcher)):uniqueInOrder(rows.map(r=&gt;r.batter));
  let targets=showAll?names:[$(&quot;#personSelect&quot;).value||names[0]].filter(Boolean);

function setMode(m){

$(&quot;#pitcherBtn&quot;).addEventListener(&quot;click&quot;,()=&gt;setMode(&quot;pitcher&quot;));

$(&quot;#allBtn&quot;).addEventListener(&quot;click&quot;,()=&gt;{showAll=!showAll;$(&quot;#allBtn&quot;).textContent=showAll?&quot;只顯示選取球員&quot;:&quot;顯示全部&quot;;render()});
$(&quot;#pdfBtn&quot;).addEventListener(&quot;click&quot;,()=&gt;window.print());
$(&quot;#file&quot;).addEventListener(&quot;change&quot;,async e=&gt;{

});
GAME=patchKnownGame(EMBEDDED);render();
&lt;/script&gt;

window.addEventListener(&quot;message&quot;, (ev) =&gt; {

function normalizeStringsDeep(value) {
  if (typeof value === "string") return tryUtf8MojibakeRepair(value).normalize("NFC");
  if (Array.isArray(value)) return value.map(normalizeStringsDeep);
  if (value && typeof value === "object") {
    const out = {};
    for (const [k,v] of Object.entries(value)) {
      const nk = tryUtf8MojibakeRepair(String(k)).normalize("NFC");
      out[nk] = normalizeStringsDeep(v);
    }
    return out;
  }
  return value;
}

async function decodeJsonFile(file) {
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);

  const attempts = [
    {label:"UTF-8", encoding:"utf-8", fatal:true},
    {label:"UTF-8（寬鬆）", encoding:"utf-8", fatal:false},
    {label:"Big5 / CP950", encoding:"big5", fatal:false}
  ];

  let best = null;
  for (const a of attempts) {
    try {
      const text = new TextDecoder(a.encoding, {fatal:a.fatal}).decode(bytes).replace(/^\uFEFF/, "");
      const parsed = JSON.parse(text);
      const normalized = normalizeStringsDeep(parsed);
      const bad = countBadChars(JSON.stringify(normalized));
      if (!best || bad < best.bad) best = {game:normalized, label:a.label, bad};
      if (bad === 0 && a.label === "UTF-8") break;
    } catch (_) {}
  }

  if (!best) {
    // 最後再試瀏覽器原生 File.text()，提供最寬容的 fallback。
    const text = (await file.text()).replace(/^\uFEFF/, "");
    best = {game:normalizeStringsDeep(JSON.parse(text)), label:"瀏覽器文字解碼 fallback", bad:countBadChars(text)};
  }
  return best;
}

function applySharedDataRepairs(game) {
  // 這裡只做「可明確辨識且已確認」的資料修復。
  // 9/19 的姓名問題不是文字編碼亂碼，而是白隊 lineup 只輸入前兩棒造成的循環錯置。
  // 正式紀錄單與熱力圖子工具本身會再套用該場已確認的打序重建規則。
  return game;
}

document.getElementById("jsonFile").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const decoded = await decodeJsonFile(f);
    currentGame = applySharedDataRepairs(decoded.game);
    sendGame(scoreFrame);
    sendGame(heatFrame);

    const away = currentGame.teams?.away?.name || "客隊";
    const home = currentGame.teams?.home?.name || "主隊";
    document.getElementById("status").textContent = `${currentGame.date || ""}｜${away} vs ${home}`;

    const repairNote = decoded.bad > 0
      ? `文字編碼：${decoded.label}；仍偵測到 ${decoded.bad} 個疑似異常字元`
      : `文字編碼：${decoded.label}；未偵測到亂碼`;
    document.getElementById("decodeStatus").textContent = repairNote;
  } catch (err) {
    document.getElementById("decodeStatus").textContent = "文字編碼：讀取失敗";
    alert("JSON 讀取失敗：" + err.message);
  }
});

document.getElementById("pdfBtn").addEventListener("click", () => {
  const frame = current === "score" ? scoreFrame : heatFrame;
  if (frame.contentWindow) frame.contentWindow.postMessage({type:"NCKU_PRINT"}, "*");
});
